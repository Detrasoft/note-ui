<div class="note-app-shell" [class.is-auth-page]="isLoginPage()">
  <header *ngIf="!isLoginPage()" class="note-navbar">
    <div class="brand">
      <i class="fa-solid fa-note-sticky logo-icon"></i>
      <span class="brand-name">DutFy Notes</span>
      <span class="badge">PRO</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/notes" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
        <i class="fa-solid fa-book-open"></i> Anotações
      </a>
      <a routerLink="/users" routerLinkActive="active">
        <i class="fa-solid fa-users"></i> Usuários
      </a>
      <a routerLink="/access-profiles" routerLinkActive="active">
        <i class="fa-solid fa-shield-halved"></i> Perfis
      </a>
      <a routerLink="/billing" routerLinkActive="active">
        <i class="fa-solid fa-credit-card"></i> Planos & Faturamento
      </a>
      <a routerLink="/support" routerLinkActive="active">
        <i class="fa-solid fa-headset"></i> Suporte
      </a>
      <a routerLink="/legal" routerLinkActive="active">
        <i class="fa-solid fa-file-contract"></i> Termos & Privacidade
      </a>
    </nav>

    <div class="navbar-actions">
      <ng-container *ngIf="auth.isAuthenticated(); else unauthenticatedTpl">
        <span class="user-greeting" *ngIf="auth.currentUser() as user">
          {{ user.fullName || user.email }}
        </span>
        <a routerLink="/profile" class="profile-btn" title="Meu Perfil">
          <i class="fa-solid fa-user-circle"></i>
        </a>
        <button class="logout-btn" (click)="logout()" title="Sair da conta">
          <i class="fa-solid fa-arrow-right-from-bracket"></i>
        </button>
      </ng-container>
      <ng-template #unauthenticatedTpl>
        <a routerLink="/login" class="login-nav-btn">
          <i class="fa-solid fa-right-to-bracket"></i> Entrar
        </a>
      </ng-template>
    </div>
  </header>

  <main class="note-main-content" [class.is-auth-main]="isLoginPage()">
    <router-outlet></router-outlet>
  </main>
</div>
